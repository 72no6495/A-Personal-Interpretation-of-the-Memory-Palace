<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Memory Palace">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="記憶の宮殿の独自解釈 — 真っ白な部屋に描き、貼り、置いて記憶する3Dメモアプリ">
  <title>A Personal Interpretation of the Memory Palace</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Klee+One:wght@600&family=Shippori+Mincho:wght@500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="view"></canvas>

  <!-- タイトル -->
  <section id="title" class="screen">
    <button class="icon-btn title-corner" id="btn-title-fullscreen" title="全画面にする" aria-label="全画面"></button>
    <div class="title-inner">
      <div class="title-mark" id="title-logo" aria-hidden="true"></div>
      <h1 class="title-en">A Personal Interpretation<br>of the Memory Palace</h1>
      <p class="title-ja">記憶の宮殿の、ひとつの解釈</p>
      <nav class="title-menu">
        <button class="btn-title" data-action="new">新しい宮殿を作る</button>
        <button class="btn-title" data-action="load">宮殿を読み込む</button>
        <button class="btn-title" data-action="settings">設定</button>
        <button class="btn-title btn-title-sub" data-action="help">操作説明</button>
      </nav>
    </div>
    <p class="title-foot">白い部屋に、描いて、貼って、置いて、覚えておく。</p>
  </section>

  <!-- 読み込み -->
  <section id="load" class="screen hidden">
    <div class="panel-screen">
      <header class="screen-head">
        <button class="btn-ghost" data-action="back" aria-label="戻る">←</button>
        <h2>宮殿を読み込む</h2>
      </header>
      <div class="load-actions">
        <button class="btn" data-action="import">バックアップファイルから読み込む</button>
      </div>
      <div id="palace-list" class="palace-list"></div>
    </div>
  </section>

  <!-- 設定 -->
  <section id="settings" class="screen hidden">
    <div class="panel-screen">
      <header class="screen-head">
        <button class="btn-ghost" data-action="back" aria-label="戻る">←</button>
        <h2>設定</h2>
      </header>
      <div id="settings-form" class="settings-form"></div>
    </div>
  </section>

  <!-- ゲーム中の表示 -->
  <div id="hud" class="hidden">
    <div id="crosshair"></div>
    <div id="topbar">
      <div class="top-left">
        <button class="icon-btn" id="btn-menu" aria-label="メニュー"></button>
        <div class="palace-name"><span id="palace-name"></span><small id="save-status"></small></div>
      </div>
      <div class="top-right">
        <button class="icon-btn" id="btn-undo" aria-label="元に戻す" title="元に戻す (Ctrl+Z)"></button>
        <button class="icon-btn" id="btn-redo" aria-label="やり直す" title="やり直す (Ctrl+Y)"></button>
      </div>
    </div>
    <div id="side-buttons">
      <button class="icon-btn" id="btn-mode" title="カーソルモード切替 (F)"></button>
      <button class="icon-btn" id="btn-face" title="面の正面を向く (G)"></button>
      <button class="icon-btn" id="btn-zoom" title="ズーム (Z)"></button>
      <button class="icon-btn" id="btn-help" title="操作説明 (H)"></button>
      <button class="icon-btn hidden" id="btn-vr" title="VR で入る"></button>
      <button class="icon-btn" id="btn-photo" title="撮影モード (P)"></button>
      <button class="icon-btn" id="btn-fullscreen" title="全画面にする"></button>
    </div>
    <button id="btn-drawmode" class="hidden"></button>
    <div id="dock">
      <div id="tool-panel"></div>
      <div id="toolbar"></div>
    </div>
    <div id="hint"></div>
    <div id="door-hint" class="hidden">クリックでドアを開く</div>
    <div id="lock-hint" class="hidden">クリックして操作を開始</div>
    <div id="stick" class="hidden"><div id="stick-knob"></div></div>
  </div>

  <!-- 撮影モード -->
  <div id="photo-ui" class="hidden">
    <div id="photo-frame"><i></i><i></i><i></i><i></i><b class="pf-vignette"></b><b class="pf-grain"></b></div>
    <div class="photo-top">
      <button class="icon-btn" data-a="exit" aria-label="撮影モードを終了">✕</button>
      <div class="photo-opts">
        <div class="photo-row"><div class="photo-media"></div><div class="photo-cams"></div><button class="chip" data-a="opts">オプション</button></div>
        <div class="photo-row photo-opt-row"><div class="photo-filters"></div></div>
        <div class="photo-row photo-opt-row"><div class="photo-aspects"></div></div>
        <div class="photo-row photo-opt-row"><div class="photo-extra"></div></div>
      </div>
    </div>
    <div class="photo-timer"></div>
    <div class="photo-bottom">
      <button class="photo-last hidden" data-a="last" aria-label="撮った写真・動画"></button>
      <label class="photo-zoom"><span>ズーム</span><input type="range" min="1" max="4" step="0.05" value="1" data-a="zoom"></label>
      <button class="photo-shutter" data-a="shutter" aria-label="撮影"><span></span></button>
    </div>
  </div>
  <div id="photo-flash"></div>

  <div id="modals"></div>
  <div id="toast"></div>
  <div id="busy" class="hidden"><div class="spinner"></div><p></p></div>
  <div id="fade"></div>
  <input type="file" id="file-input" hidden>

  <script type="module" src="js/main.js"></script>
</body>
</html>
